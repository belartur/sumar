# Sumar — przykładowy VirtualHost dla Apache 2.4 na Debianie
# Wgranie na serwer:
#   1) zbuduj lokalnie: npm run build
#   2) wyślij: scp -r dist/* user@serwer:/var/www/sumar/
#   3) ten plik -> /etc/apache2/sites-available/sumar.conf
#   4) a2ensite sumar && systemctl reload apache2

<VirtualHost *:80>
    ServerName sumar.twoja-domena.pl
    # albo IP serwera, jeśli nie masz domeny

    DocumentRoot /var/www/sumar

    <Directory /var/www/sumar>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Kompresja (wymaga: a2enmod deflate)
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css application/javascript text/javascript
    </IfModule>

    # Cache dla assetów z hashem w nazwie (index-XXXX.js) — rok
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType application/javascript "access plus 1 year"
        ExpiresByType text/css "access plus 1 year"
        # index.html zawsze świeży
        <Files "index.html">
            ExpiresByType text/html "access plus 0 seconds"
            Header set Cache-Control "no-cache"
        </Files>
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/sumar_error.log
    CustomLog ${APACHE_LOG_DIR}/sumar_access.log combined
</VirtualHost>

# Wariant B — gra w podkatalogu istniejącej strony, np. https://twoja-domena.pl/sumar/
# Nie potrzebujesz osobnego VirtualHosta, wystarczy:
#   scp -r dist/* user@serwer:/var/www/html/sumar/
# Dzięki base: './' w vite.config.ts ścieżki ./assets/... zadziałają i tu.
